# Rebuilds the Sileo source (Packages, Release) and publishes it on GitHub Pages whenever a
# .deb is added to debs/ (or anything else changes).
name: Publier la source Sileo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils APT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev
      - name: Index de la source
        run: scripts/build-index.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
